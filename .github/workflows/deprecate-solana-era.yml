name: deprecate-solana-era

on:
  workflow_dispatch:

jobs:
  deprecate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/587188292103/locations/global/workloadIdentityPools/github-oidc-pool/providers/github
          service_account: github-actions-toreva-kit@toreva-prod.iam.gserviceaccount.com
      - id: secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            npm_token:toreva-prod/npm-token-toreva-kit

      - name: Deprecate Solana-era npm versions
        env:
          NODE_AUTH_TOKEN: ${{ steps.secrets.outputs.npm_token }}
          MSG: This release is retired. See https://toreva.com for the current Toreva gateway connector kit.
        run: |
          npm deprecate "@toreva/cli@<=0.1.1" "$MSG"
          npm deprecate "@toreva/sdk@<=0.2.1" "$MSG"
          npm deprecate "@toreva/mcp@<=0.2.0" "$MSG"

      - name: Deprecate Solana-era MCP Registry versions
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          for v in 0.1.1 0.2.0; do
            ./mcp-publisher status --status deprecated \
              --message "Retired. See https://toreva.com for the current Toreva gateway connector kit." \
              io.github.toreva/kit "$v"
          done
